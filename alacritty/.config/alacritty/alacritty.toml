[general]
import = ["/home/sirine/.config/alacritty/themes/noctalia.toml"]

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10
dynamic_padding = false
opacity = 0.95
decorations = "None"
blur = true

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Bold Italic"

[cursor]
unfocused_hollow = true
blink_interval = 750

[cursor.style]
shape = "Block"
blinking = "On"

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#EBA0AC"

[colors.primary]
background = '#0D0E15'
foreground = '#CDD6F4'
dim_foreground = '#CDD6F4'
bright_foreground = '#CDD6F4'

[colors.cursor]
text = '#11111B'
cursor = '#F5E0DC'

[colors.vi_mode_cursor]
text = '#11111B'
cursor = '#B4BEFE'

[colors.search.matches]
foreground = '#11111B'
background = '#A6ADC8'

[colors.search.focused_match]
foreground = '#11111B'
background = '#A6E3A1'

[colors.footer_bar]
foreground = '#11111B'
background = '#A6ADC8'

[colors.hints.start]
foreground = '#11111B'
background = '#F9E2AF'

[colors.hints.end]
foreground = '#11111B'
background = '#A6ADC8'

[colors.selection]
text = '#11111B'
background = '#F5E0DC'

[colors.normal]
black   = '#45475A'
red     = '#F38BA8'
green   = '#A6E3A1'
yellow  = '#F9E2AF'
blue    = '#89B4FA'
magenta = '#F5C2E7'
cyan    = '#94E2D5'
white   = '#BAC2DE'

[colors.bright]
black   = '#585B70'
red     = '#F38BA8'
green   = '#A6E3A1'
yellow  = '#F9E2AF'
blue    = '#89B4FA'
magenta = '#F5C2E7'
cyan    = '#94E2D5'
white   = '#A6ADC8'

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

